# Fill client_id after creating the app in the Shopify Dev Dashboard / `shopify app config link`
name = "DHL Landed Cost Estimator"
client_id = "REPLACE_WITH_CLIENT_ID"
application_url = "https://YOUR-SERVER.onrender.com"
embedded = false

[access_scopes]
scopes = ""

[auth]
redirect_urls = ["https://YOUR-SERVER.onrender.com/auth/callback"]

[app_proxy]
url = "https://YOUR-SERVER.onrender.com"
subpath = "landed-cost"
prefix = "apps"

[webhooks]
api_version = "2025-10"
